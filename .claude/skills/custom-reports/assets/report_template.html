<!--
  Custom report template. Copy this file per report, then replace every
  {{PLACEHOLDER}} below. Read references/brand.json first and set the CSS
  variables in :root plus the header logo/company name to match.

  Section order is fixed on purpose (see SKILL.md) — don't add or reorder
  top-level <section> elements. Delete the #annexes section entirely if
  there's nothing to append.
-->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --color-primary: {{COLOR_PRIMARY}};   /* e.g. #1B2A4A, from brand.json colors.primary */
    --color-accent: {{COLOR_ACCENT}};     /* e.g. #2E7DE1, from brand.json colors.accent */
    --color-text: {{COLOR_TEXT}};         /* e.g. #1A1A1A */
    --color-muted: {{COLOR_MUTED}};       /* e.g. #6B7280 */
    --color-positive: {{COLOR_POSITIVE}}; /* e.g. #0F9D58 */
    --color-negative: {{COLOR_NEGATIVE}}; /* e.g. #D93025 */
    --font-family: {{FONT_FAMILY}};       /* e.g. 'Helvetica Neue', Arial, sans-serif */
  }

  @page { size: A4; margin: 0; }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-family);
    color: var(--color-text);
    margin: 0;
    line-height: 1.5;
    font-size: 11pt;
  }

  section { padding: 0 0 8mm 0; page-break-inside: avoid; }
  section + section { page-break-before: auto; }

  /* Cover */
  #cover {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100vh;
    page-break-after: always;
    padding: 20mm 16mm;
  }
  #cover .brand-header { display: flex; align-items: center; gap: 12px; }
  #cover .brand-header img { max-height: 40px; }
  #cover .brand-header .company-name { font-weight: 600; color: var(--color-primary); font-size: 14pt; }
  #cover .cover-main { margin-top: auto; margin-bottom: auto; }
  #cover h1 { font-size: 28pt; color: var(--color-primary); margin: 0 0 6px 0; }
  #cover .subtitle { font-size: 14pt; color: var(--color-muted); margin: 0 0 24px 0; }
  #cover .meta { color: var(--color-muted); font-size: 10pt; }

  h2 {
    color: var(--color-primary);
    font-size: 16pt;
    border-bottom: 2px solid var(--color-accent);
    padding-bottom: 4px;
    margin: 0 0 12px 0;
  }
  h3 { color: var(--color-primary); font-size: 12.5pt; margin: 16px 0 6px 0; }

  .content-section { padding: 10mm 16mm 4mm 16mm; }

  /* KPI cards */
  .kpi-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .kpi-card {
    flex: 1 1 0;
    min-width: 38mm;
    border: 1px solid #E5E7EB;
    border-left: 4px solid var(--color-accent);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .kpi-card .kpi-label { font-size: 8.5pt; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-card .kpi-value { font-size: 20pt; font-weight: 700; color: var(--color-primary); margin: 2px 0; }
  .kpi-card .kpi-delta { font-size: 9pt; font-weight: 600; }
  .kpi-card .kpi-delta.positive { color: var(--color-positive); }
  .kpi-card .kpi-delta.negative { color: var(--color-negative); }

  /* Charts */
  figure { margin: 0 0 14px 0; text-align: center; }
  figure img { max-width: 100%; }
  figure figcaption { font-size: 9pt; color: var(--color-muted); margin-top: 4px; }
  .chart-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .chart-grid figure { flex: 1 1 45%; }

  table { width: 100%; border-collapse: collapse; margin: 8px 0 16px 0; font-size: 9.5pt; }
  th, td { border: 1px solid #E5E7EB; padding: 6px 8px; text-align: left; }
  th { background: #F3F4F6; color: var(--color-primary); }

  ol, ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
</style>
</head>
<body>

  <section id="cover">
    <div class="brand-header">
      {{LOGO_HTML}} <!-- e.g. <img src="logo.png"> if brand.json has a logo, else omit -->
      <span class="company-name">{{COMPANY_NAME}}</span>
    </div>
    <div class="cover-main">
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
    </div>
    <div class="meta">
      Période : {{PERIOD}}<br>
      Généré le {{DATE}}
    </div>
  </section>

  <section id="executive-summary" class="content-section">
    <h2>Résumé exécutif</h2>
    <p>{{EXEC_SUMMARY}}</p>
  </section>

  <section id="key-findings" class="content-section">
    <h2>Constats &amp; indicateurs clés</h2>
    <div class="kpi-row">
      {{KPI_CARDS}}
      <!--
        Repeat per KPI:
        <div class="kpi-card">
          <div class="kpi-label">Nom du KPI</div>
          <div class="kpi-value">123 456</div>
          <div class="kpi-delta positive">+12% vs période précédente</div>
        </div>
      -->
    </div>
    <div class="chart-grid">
      {{CHARTS}}
      <!--
        Repeat per chart:
        <figure>
          <img src="chart_1.png" alt="...">
          <figcaption>Description courte du graphique</figcaption>
        </figure>
      -->
    </div>
  </section>

  <section id="analysis" class="content-section">
    <h2>Analyse</h2>
    {{ANALYSIS}}
  </section>

  <section id="recommendations" class="content-section">
    <h2>Recommandations</h2>
    {{RECOMMENDATIONS}}
  </section>

  <section id="annexes" class="content-section">
    <h2>Annexes</h2>
    {{ANNEXES}}
  </section>

</body>
</html>
